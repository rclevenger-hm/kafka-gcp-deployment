name: Validate and publish prepared history
on:
  push:
    branches: [validation/publish-prepared]
permissions:
  contents: write
  statuses: write
concurrency:
  group: kafka-prepared-history
  cancel-in-progress: true
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and load prepared Git history
        run: |
          base64 --decode .prepared/history.bundle.b64 > "$RUNNER_TEMP/history.bundle"
          git bundle verify "$RUNNER_TEMP/history.bundle"
          git fetch "$RUNNER_TEMP/history.bundle" main:refs/heads/prepared
          git merge-base --is-ancestor origin/main prepared
          git checkout prepared
          echo "PREPARED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
      - name: Unit, documentation and shell checks
        run: |
          python -m unittest discover -s tests -v
          python tools/check_repo.py
          bash -n bootstrap/startup.sh
      - name: Validate Terraform and mock deployment plans
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform validate -no-color
          terraform -chdir=terraform test -no-color
      - name: Verify real Kafka TLS, ACL and recovery behavior
        run: |
          python tools/fetch_test_runtime.py
          python tests/integration.py --kafka-home .local/kafka_2.13-4.1.2 --jmx-jar .local/jmx.jar
      - name: Validate alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/work:ro" prom/prometheus:v3.2.1 check rules /work/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/work:ro" prom/prometheus:v3.2.1 test rules /work/alerts.test.yml
      - name: Publish validated history without rewriting remote commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PREPARED_SHA" \
            -f state=success -f context='Prepared deployment validation' \
            -f description='Python, Terraform plans, six-node Kafka and alerts passed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
